    const Icon = ({ name, size = 18, className = "", color }) => {
      const containerRef = useRef(null);

      useEffect(() => {
        if (containerRef.current && window.lucide) {
          containerRef.current.innerHTML = '';
          const i = document.createElement('i');
          i.setAttribute('data-lucide', name);
          if (className) i.className = className;
          containerRef.current.appendChild(i);
          window.lucide.createIcons({
            root: containerRef.current,
            attrs: {
              width: size,
              height: size,
              strokeWidth: 2,
              ...(color ? { stroke: color } : {})
            }
          });
        }
      }, [name, size, className, color]);

      return <span ref={containerRef} className={`inline-flex items-center justify-center ${className}`} />;

                            {/* If user attached item */}
                            {msg.attachedItem && (
                              <div className="mb-2 p-2 bg-emerald-900/30 rounded-xl border border-white/20 flex items-center space-x-2">
                                <img src={msg.attachedItem.image} className="w-8 h-8 rounded-lg object-cover" />
                                <div className="text-[11px] leading-tight">
                                  <div className="font-bold text-emerald-100">{msg.attachedItem.title}</div>
                                  <div className="text-[10px] text-emerald-200 opacity-90">관리번호: {msg.attachedItem.id}</div>
                                </div>
                              </div>
                            )}
                            <p className="whitespace-pre-line">{msg.text}</p>
                          </div>
                        </div>

                        <span className="text-[9.5px] text-slate-400 mt-1 px-1">
                          {msg.time}
                        </span>
                      </div>
                    );
                  })}

                  {/* Typing Indicator */}
                  {isTyping && (
                    <div className="flex items-center space-x-1.5 text-slate-400 text-xs pl-9">
                      <div className="w-2 h-2 rounded-full bg-cnu animate-bounce"></div>
                      <div className="w-2 h-2 rounded-full bg-cnu animate-bounce [animation-delay:0.2s]"></div>
                      <div className="w-2 h-2 rounded-full bg-cnu animate-bounce [animation-delay:0.4s]"></div>
                      <span className="text-[11px] font-medium text-slate-500 ml-1">관리자가 답변을 작성 중입니다...</span>
                    </div>
                  )}

                  <div ref={chatEndRef} />
                </div>

                {/* Quick Reply Suggestions (현장 조사 인사이트 반영) */}
                <div className="bg-white border-t border-slate-200 px-3 py-2">
                  <div className="text-[10.5px] font-semibold text-slate-400 mb-1 flex items-center space-x-1">
                    <Icon name="sparkles" size={11} className="text-amber-500" />
                    <span>자주 묻는 질문 빠른 선택</span>
                  </div>
                  <div className="flex space-x-1.5 overflow-x-auto no-scrollbar pb-0.5">
                    <button
                      onClick={() => handleSendMessage("지금 방문해도 수령 가능한가요?")}
                      className="px-2.5 py-1 rounded-full bg-slate-100 hover:bg-emerald-50 hover:text-cnu text-slate-700 text-[11px] font-medium whitespace-nowrap border border-slate-200 transition"
                    >
                      🏃 지금 방문해도 수령 가능한가요?
                    </button>
                    <button
                      onClick={() => handleSendMessage("본인 확인은 어떻게 하나요?")}
                      className="px-2.5 py-1 rounded-full bg-slate-100 hover:bg-emerald-50 hover:text-cnu text-slate-700 text-[11px] font-medium whitespace-nowrap border border-slate-200 transition"
                    >
                      🔍 본인 확인은 어떻게 하나요?
                    </button>
                    <button
                      onClick={() => handleSendMessage("보관 기간 연장 문의")}
                      className="px-2.5 py-1 rounded-full bg-slate-100 hover:bg-emerald-50 hover:text-cnu text-slate-700 text-[11px] font-medium whitespace-nowrap border border-slate-200 transition"
                    >
                      ⏱️ 보관 기간 연장 문의
                    </button>
                    <button
                      onClick={() => handleSendMessage("대리 수령도 가능한가요?")}
                      className="px-2.5 py-1 rounded-full bg-slate-100 hover:bg-emerald-50 hover:text-cnu text-slate-700 text-[11px] font-medium whitespace-nowrap border border-slate-200 transition"
                    >
                      👥 대리 수령 문의
                    </button>
                  </div>
                </div>

                {/* Chat Input Bar */}
                <div className="bg-white p-2.5 border-t border-slate-100 flex items-center space-x-2">
                  <input
                    type="text"
                    value={chatInput}
                    onChange={(e) => setChatInput(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && handleSendMessage()}
                    placeholder="관리자에게 문의사항을 남겨주세요..."
                    className="flex-1 bg-slate-100 border-none rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-cnu"
                  />
                  <button
                    onClick={() => handleSendMessage()}
                    disabled={!chatInput.trim()}
                    className={`w-9 h-9 rounded-xl flex items-center justify-center transition ${
                      chatInput.trim()
                        ? 'bg-cnu text-white hover:bg-cnu-light active:scale-95 shadow-sm'
                        : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                    }`}
                  >
                    <Icon name="send" size={16} />
                  </button>
                </div>
              </div>
            )}

            {/* TAB 3: 습득물 안내 & 입고알림 */}
            {activeTab === "guide" && (
              <div className="p-3.5 space-y-4">
                
                {/* SECTION A: 습득자용 인계 가이드 (에타 업로드 주의 & 맡기는 법) */}
                <div className="bg-white rounded-2xl p-4 border border-slate-200/90 shadow-xs">
                  <div className="flex items-center space-x-2 mb-2.5">
                    <div className="w-7 h-7 rounded-lg bg-rose-100 text-rose-600 flex items-center justify-center font-bold">
                      <Icon name="alert-triangle" size={16} />
                    </div>
                    <div>
                      <h2 className="text-sm font-bold text-slate-900">물건을 주우셨나요? (습득자 안내)</h2>
                      <p className="text-[11px] text-slate-500">에브리타임 업로드 전 꼭 읽어주세요</p>
                    </div>
                  </div>

                  {/* Warning Notice Box */}
                  <div className="bg-rose-50 border border-rose-200 rounded-xl p-3 text-xs text-rose-900 leading-relaxed mb-3">
                    <p className="font-bold flex items-center gap-1 text-rose-700 mb-1">
                      <Icon name="shield-x" size={14} />
                      에브리타임에 학생증/카드 사진을 올리지 마세요!
                    </p>
                    이름, 얼굴, 학번, 카드번호가 노출된 게시물은 <span className="underline font-semibold">개인정보보호법 위반</span> 및 2차 도용 피해 위험이 있습니다. 가까운 <strong>제1·2학생회관 보관함</strong>에 맡겨주시면 안전하게 마스킹 후 공지됩니다.
                  </div>

                  {/* Drop-off Hub Cards */}
                  <div className="space-y-2">
                    <div className="p-3 bg-slate-50 rounded-xl border border-slate-200">
                      <div className="flex items-center justify-between">
                        <span className="font-bold text-xs text-cnu flex items-center gap-1.5">
                          <Icon name="map-pin" size={13} />
                          제1학생회관 1층 통합보관함
                        </span>
                        <span className="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold">인문·사회·자연 권역</span>
                      </div>
                      <p className="text-[11.5px] text-slate-600 mt-1.5 leading-snug">
                        📍 <strong>위치:</strong> 제1학생회관 1층 학생자치기구실 앞 무인 습득물 수거함 및 관리실
                      </p>
                      <p className="text-[11px] text-slate-400 mt-0.5">
                        * 주말 및 야간에도 무인 투입함(24시간)에 보관 가능
                      </p>
                    </div>

                    <div className="p-3 bg-slate-50 rounded-xl border border-slate-200">
                      <div className="flex items-center justify-between">
                        <span className="font-bold text-xs text-cnu flex items-center gap-1.5">
                          <Icon name="map-pin" size={13} />
                          제2학생회관 1층 통합보관함
                        </span>
                        <span className="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold">공과·경영·농생 권역</span>
                      </div>
                      <p className="text-[11.5px] text-slate-600 mt-1.5 leading-snug">
                        📍 <strong>위치:</strong> 제2학생회관 1층 편의점 옆 통합안내데스크 수거함
                      </p>
                      <p className="text-[11px] text-slate-400 mt-0.5">
                        * 습득 후 투입 시 접수증 바코드가 자동 발급됩니다
                      </p>
                    </div>
                  </div>
                </div>

                {/* SECTION B: 비로그인 입고 알림 신청 */}
                <div className="bg-white rounded-2xl p-4 border border-slate-200/90 shadow-xs">
                  <div className="flex items-center justify-between mb-2">
                    <div className="flex items-center space-x-2">
                      <div className="w-7 h-7 rounded-lg bg-cnu-tint text-cnu flex items-center justify-center font-bold">
                        <Icon name="bell-ring" size={16} />
                      </div>
                      <div>
                        <h2 className="text-sm font-bold text-slate-900">비로그인 입고 알림 신청</h2>
                        <p className="text-[11px] text-slate-500">아직 분실물이 등록되지 않았나요?</p>
                      </div>
                    </div>
                    <span className="text-[10.5px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-semibold">
                      회원가입 불필요
                    </span>
                  </div>

                  <p className="text-xs text-slate-600 mb-3.5 leading-relaxed">
                    잃어버린 물건의 키워드를 등록해두시면, 제1·2학생회관에 일치하는 습득물이 접수되는 즉시 카카오 알림톡 또는 문자로 알려드립니다.
                  </p>

                  {/* Form */}
                  <form
                    onSubmit={(e) => {
                      e.preventDefault();
                      showToast("🔔 입고 알림이 성공적으로 등록되었습니다! 유사 물품 접수 시 즉시 안내됩니다.");
                      e.target.reset();
                    }}
                    className="space-y-3"
                  >
                    <div>
                      <label className="block text-[11px] font-bold text-slate-600 mb-1">물품 카테고리 *</label>
                      <select required className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium focus:ring-2 focus:ring-cnu focus:outline-none">
                        <option value="">카테고리를 선택하세요</option>
                        {CATEGORIES.filter(c => c !== "전체").map(c => (
                          <option key={c} value={c}>{c}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-[11px] font-bold text-slate-600 mb-1">물품 상세 특징 키워드 *</label>
                      <input
                        type="text"
                        required
                        placeholder="예: 노란색 실리콘 에어팟 케이스, 춘식이 키링"
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-cnu focus:outline-none"
                      />
                    </div>

                    <div>
                      <label className="block text-[11px] font-bold text-slate-600 mb-1">분실 예상 구역</label>
                      <select className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium focus:ring-2 focus:ring-cnu focus:outline-none">
                        {AREAS.map(a => (
                          <option key={a} value={a}>{a}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-[11px] font-bold text-slate-600 mb-1">
                        알림 받을 연락처 / 카카오톡 (선택)
                      </label>
                      <input
                        type="text"
                        placeholder="010-0000-0000 (알림 발송 후 즉시 파기)"
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-cnu focus:outline-none"
                      />
                      <span className="text-[10px] text-slate-400 mt-1 block">
                        * 알림 발송 목적 외에는 사용되지 않으며, 14일 후 자동 영구 파기됩니다.
                      </span>
                    </div>

                    <button
                      type="submit"
                      className="w-full py-2.5 bg-cnu hover:bg-cnu-light text-white rounded-xl text-xs font-bold transition shadow-sm active:scale-[0.99] flex items-center justify-center space-x-1.5"
                    >
                      <Icon name="check-circle" size={15} />
                      <span>무로그인 키워드 입고 알림 신청</span>
                    </button>
                  </form>
                </div>
              </div>
            )}

          </main>

          {/* ITEM DETAIL MODAL / BOTTOM SHEET */}
          {selectedItem && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div 
                className="w-full max-w-[430px] bg-white rounded-t-3xl sm:rounded-3xl max-h-[90vh] flex flex-col overflow-hidden shadow-2xl animate-in slide-in-from-bottom duration-200"
              >
                {/* Modal Header */}
                <div className="p-4 border-b border-slate-100 flex items-center justify-between sticky top-0 bg-white z-10">
                  <div className="flex items-center space-x-1.5">
                    <span className="text-[11px] font-bold bg-slate-100 text-slate-700 px-2 py-0.5 rounded">
                      {selectedItem.id}
                    </span>
                    <span className={`text-[11px] font-black px-2 py-0.5 rounded-full ${
                      selectedItem.daysRemaining <= 5 ? 'bg-rose-100 text-rose-600' : 'bg-emerald-100 text-cnu'
                    }`}>
                      보관 만료 D-{selectedItem.daysRemaining}
                    </span>
                  </div>
                  <button 
                    onClick={() => setSelectedItem(null)}
                    className="p-1 rounded-full text-slate-400 hover:text-slate-600 hover:bg-slate-100"
                  >
                    <Icon name="x" size={20} />
                  </button>
                </div>

                {/* Modal Scrollable Body */}
                <div className="overflow-y-auto p-4 space-y-4">
                  {/* Big Image with Blur Warning */}
                  <div className="relative rounded-2xl overflow-hidden bg-slate-100 border border-slate-200 aspect-video">
                    <img
                      src={selectedItem.image}
                      alt={selectedItem.title}
                      className={`w-full h-full object-cover ${selectedItem.isBlurred ? 'blur-lg scale-105' : ''}`}
                    />
                    {selectedItem.isBlurred && (
                      <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-xs flex flex-col items-center justify-center p-4 text-center">
                        <Icon name="lock" size={26} className="text-amber-400 mb-1.5" />
                        <span className="text-xs font-bold text-white mb-0.5">🔒 개인정보 보호 가림 처리됨</span>
                        <p className="text-[11px] text-slate-200 max-w-[260px] leading-relaxed">
                          학생증 사진, 이름, 카드번호 등 개인식별정보 보호를 위해 마스킹되었습니다.
                        </p>
                      </div>
                    )}
                  </div>

                  {/* Title & Info */}
                  <div>
                    <span className="text-xs font-semibold text-cnu">{selectedItem.category}</span>
                    <h2 className="text-base font-bold text-slate-900 mt-0.5 leading-snug">
                      {selectedItem.title}
                    </h2>
                  </div>

                  {/* Specification Table */}
                  <div className="bg-slate-50 rounded-2xl p-3.5 space-y-2.5 border border-slate-200/80 text-xs">
                    <div className="flex justify-between items-start">
                      <span className="text-slate-400 font-medium shrink-0">습득 위치</span>
                      <span className="text-slate-800 font-bold text-right">{selectedItem.place}</span>
                    </div>
                    <div className="flex justify-between items-start">
                      <span className="text-slate-400 font-medium shrink-0">접수 일시</span>
                      <span className="text-slate-800 font-bold">{selectedItem.foundDate} (14일간 보관)</span>
                    </div>
                    <div className="flex justify-between items-start">
                      <span className="text-slate-400 font-medium shrink-0">현재 보관 거점</span>
                      <span className="text-cnu font-black text-right">{selectedItem.storageLocation}</span>
                    </div>
                    <div className="flex justify-between items-start">
                      <span className="text-slate-400 font-medium shrink-0">보관소 운영시간</span>
                      <span className="text-slate-800 font-bold">평일 10:00 ~ 18:00 (공휴일 제외)</span>
                    </div>
                  </div>

                  {/* Detailed Description */}
                  <div>
                    <h3 className="text-xs font-bold text-slate-700 mb-1.5 flex items-center gap-1">
                      <Icon name="align-left" size={13} className="text-cnu" />
                      물품 세부 특징
                    </h3>
                    <p className="text-xs text-slate-600 bg-slate-50 p-3 rounded-xl border border-slate-100 leading-relaxed">
                      {selectedItem.description}
                    </p>
                  </div>

                  {/* Caution / How to Claim */}
                  <div className="bg-amber-50 rounded-xl p-3 border border-amber-200/80 text-[11.5px] text-amber-900 leading-relaxed">
                    <strong className="font-bold flex items-center gap-1 mb-1 text-amber-950">
                      <Icon name="check-check" size={13} className="text-amber-700" />
                      수령 및 본인 확인 안내
                    </strong>
                    {selectedItem.caution}
                  </div>
                </div>

                {/* Modal Footer CTA Button */}
                <div className="p-3.5 border-t border-slate-100 bg-white sticky bottom-0">
                  <button
                    onClick={() => handleClaimItem(selectedItem)}
                    className="w-full py-3 bg-cnu hover:bg-cnu-light active:scale-[0.99] text-white rounded-2xl font-bold text-sm transition shadow-md flex items-center justify-center space-x-2"
                  >
                    <Icon name="message-square" size={17} />
                    <span>이 물건 내 것 같아요 (보관소 관리자 채팅)</span>
                  </button>
                  <p className="text-center text-[10.5px] text-slate-400 mt-2">
                    클릭 시 해당 보관소({selectedItem.storageHub}) 1:1 대화방으로 물품 정보가 자동 첨부됩니다.
                  </p>
                </div>
              </div>
            </div>
          )}

          {/* BOTTOM TAB NAVIGATION (3개 탭 구성, 모바일 엄지 최적화) */}
          <nav className="fixed bottom-0 w-full max-w-[430px] bg-white/95 backdrop-blur-md border-t border-slate-200 z-30 px-3 py-2 flex justify-around items-center shadow-lg sm:rounded-b-3xl">
            
            {/* Tab 1: 분실물 찾기 */}
            <button
              onClick={() => setActiveTab("search")}
              className={`flex-1 flex flex-col items-center py-1 transition-all ${
                activeTab === "search" ? 'text-cnu font-bold' : 'text-slate-400 hover:text-slate-600'
              }`}
            >
              <div className={`p-1 rounded-xl transition ${activeTab === "search" ? 'bg-cnu-tint' : ''}`}>
                <Icon name="search" size={20} className={activeTab === "search" ? "text-cnu" : "text-slate-400"} />
              </div>
              <span className="text-[11px] mt-0.5">분실물 찾기</span>
            </button>

            {/* Tab 2: 관리자 1:1 채팅 */}
            <button
              onClick={() => setActiveTab("chat")}
              className={`flex-1 flex flex-col items-center py-1 transition-all relative ${
                activeTab === "chat" ? 'text-cnu font-bold' : 'text-slate-400 hover:text-slate-600'
              }`}
            >
              <div className={`p-1 rounded-xl relative transition ${activeTab === "chat" ? 'bg-cnu-tint' : ''}`}>
                <Icon name="message-circle-question" size={20} className={activeTab === "chat" ? "text-cnu" : "text-slate-400"} />
                {/* Live simulation indicator dot */}
                <span className="absolute top-0 right-0 w-2 h-2 bg-emerald-500 rounded-full ring-2 ring-white"></span>
              </div>
              <span className="text-[11px] mt-0.5">관리자 1:1 채팅</span>
            </button>

            {/* Tab 3: 습득물 안내 & 입고알림 */}
            <button
              onClick={() => setActiveTab("guide")}
              className={`flex-1 flex flex-col items-center py-1 transition-all ${
                activeTab === "guide" ? 'text-cnu font-bold' : 'text-slate-400 hover:text-slate-600'
              }`}
            >
              <div className={`p-1 rounded-xl transition ${activeTab === "guide" ? 'bg-cnu-tint' : ''}`}>
                <Icon name="bell-ring" size={20} className={activeTab === "guide" ? "text-cnu" : "text-slate-400"} />
              </div>
              <span className="text-[11px] mt-0.5">습득물 안내/알림</span>
            </button>

          </nav>

        </div>
      );
    }

    // Mount to root DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
